[package]
name = "wz-parser"
description = "A WASM-compatible wz file reader for MapleStory .wz files"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
aes = "0.8.4"
ecb = "0.1.2"
flate2 = { version = "1.0.28", features = ["miniz_oxide"] }
hashbrown = "0.14.3"
scroll = "0.12.0"
thiserror = "1.0.57"
indexmap = "2.3.0"

# Image processing - conditional features for WASM
[dependencies.image]
version = "0.25.2"
default-features = false
features = ["png", "jpeg"]

# Add rayon feature for non-WASM targets
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.image]
version = "0.25.2"
default-features = false
features = ["png", "jpeg", "rayon"]

# Rayon for parallel processing - disabled on WASM
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.9.0"

# Optional serialization support
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
json = ["serde", "dep:serde_json"]
serde = ["dep:serde", "hashbrown/serde", "indexmap/serde"]

# WASM-specific optimizations
[profile.release]
opt-level = "s"
lto = true

[lib]
crate-type = ["cdylib", "rlib"]