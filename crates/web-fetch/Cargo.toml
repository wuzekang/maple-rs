[package]
name = "web-fetch"
version = "0.1.0"
edition = "2021"
description = "Web fetch utilities for Emscripten target"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = { version = "0.3", default-features = false, features = ["alloc", "std"] }
async-runtime = { path = "../async-runtime" }

# Platform-specific async runtime
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time"] }
# libc = "0.2"

[target.'cfg(target_os = "emscripten")'.dependencies]
libc = "0.2"
futures-channel = "0.3"

[lib]
crate-type = ["rlib"]

[[example]]
name = "future_demo"

[dev-dependencies]
