[package]
name = "wz-splitter"
version = "0.1.0"
edition = "2021"

[dependencies]
wz-parser = { path = "../wz-parser" }
web-fetch = { path = "../web-fetch" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indicatif = "0.17"
rayon = "1.10"
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
lru = "0.12"
thiserror = "1.0"

# 仅在非 WASM 目标上使用 tokio
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }

[[bin]]
name = "wz-splitter"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.10"
